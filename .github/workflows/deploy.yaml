name: 'Deployment'

on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
    workflow_dispatch:

env:
    USERAGENT: ${{ secrets.USERAGENT }}
    PASSWORD: ${{ secrets.PASSWORD }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - uses: pnpm/action-setup@v4
            - name: Set Node Version
              uses: actions/setup-node@v4
              with:
                  node-version: 24.x
                  cache: pnpm
            - name: Install dependencies
              run: pnpm install --frozen-lockfile
            - name: Run Deploy Script
              run: pnpm run deploy --message=${{ github.event.head_commit.message }} --id=${{ github.event.head_commit.id }} --author=${{ github.event.head_commit.author.username }}
